[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "onomly"
version = "0.1.1"
description = "Onomly — AI brand-naming and validation engine (generate, score, and clear names across domain, trademark, and social channels)"
authors = [{name = "Hermes Agent"}]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
    "pydantic>=2.0",
    "litellm>=1.0",
    "typer>=0.9",
    "httpx>=0.25",
    "aiosqlite>=0.19",
]

[project.scripts]
onomly = "launch_engine.cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "black",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-v"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "C90"]
ignore = ["E501", "E402"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true